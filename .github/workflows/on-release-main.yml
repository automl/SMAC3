name: release-main

on:
  push:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in pyproject.toml"
            exit 1
          fi
          echo "Version: $VERSION  Tag: v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, nothing to release"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

  publish:
    runs-on: ubuntu-latest
    needs: [check-version]
    if: needs.check-version.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^# [0-9]/ { if (found) exit; if ($2 == v) { found=1; next } } found { print }' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No section '# $VERSION' found in CHANGELOG.md"
            exit 1
          fi
          cat release_notes.md

      - name: Set up the environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build dist
        run: |
          pip install build
          python -m build

      - name: Twine check
        run: |
          pip install twine
          twine check --strict dist/*
          pip install dist/*.whl

      - name: Publish package
        run: python -m twine upload dist/*

      - name: Create tag and GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-docs:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          extra-packages: "pymdown-extensions<12.2"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy documentation
        run: uv run mike deploy -F mkdocs.yaml --push --update-aliases "v${{ needs.check-version.outputs.version }}" latest
