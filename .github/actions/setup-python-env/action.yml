name: "Setup Python env"
description: "Set up Python and uv, and install the package with its extras into .venv"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.10"
  extras:
    description: "Extras to install, e.g. 'dev' or 'gpytorch,dev'"
    required: false
    default: "dev"
  extra-packages:
    description: "Additional packages to install, e.g. version constraints"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      
    - name: Install dependencies
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        uv venv --python "${{ inputs.python-version }}"
        uv pip install -e ".[$EXTRAS]" $EXTRA_PACKAGES
